name = "biblioscan-galaxia"
main = "src/index.js"
compatibility_date = "2026-10-01"

# El visualizador (public/index.html) se sirve como archivo estático; /galaxy y /sun los atiende el Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/galaxy", "/sun"]

# Base de datos D1 (plan gratuito). creada en la región WEUR.
[[d1_databases]]
binding = "DB"
database_name = "biblioscan-galaxia"
database_id = "926ba6dc-b169-46b2-8d8d-5a77eb79c3e2"
