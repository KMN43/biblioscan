<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BiblioScan · vídeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #1d1d1d; color: #ecebe6; font: 13px 'IBM Plex Mono', monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  canvas { height: calc(100vh - 70px); aspect-ratio: 9 / 16; background: #ff4f12; display: block; }
  .ctl { display: flex; gap: 10px; align-items: center; width: min(90vw, 560px); }
  input { flex: 1; } button { font: inherit; background: #ecebe6; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="ctl"><button id="pp">▶</button><input id="sc" type="range" min="0" max="40" step="0.01" value="0"><span id="tt">0.0 s</span><button id="ex">Exportar</button></div>
<script>
(async () => {
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const W = 1080, H = 1920, FPS = 30, DUR = 40;
const O = '#ff4f12', K = '#121212', C = '#fff4e1', P = '#ecebe6', DK = '#1b1b1b';
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => cl((t - a) / (b - a));
const eo = t => 1 - Math.pow(1 - t, 3), eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const back = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const mul = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const mixHex = (a, b, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };
const SG = (w, s) => `${w} ${s}px "Space Grotesk", sans-serif`, MONO = (w, s) => `${w} ${s}px "IBM Plex Mono", monospace`;
await Promise.all([document.fonts.load(SG(500, 100)), document.fonts.load(MONO(500, 30)), document.fonts.load(MONO(600, 30))]);

// ---------- logo (misma geometría que logo.py) ----------
const BOOK = new Path2D('M-46 30 L-46 -28 L-27 -28 A24 24 0 0 1 -3 -4 L0 1 L3 -4 A24 24 0 0 1 27 -28 L46 -28 L46 30 Z');
function star(cx, cy, R, col, rot = 0) {
  const k = R * 2.6 / 22; x.save(); x.translate(cx, cy); x.rotate(rot); x.beginPath();
  x.moveTo(0, -R); x.quadraticCurveTo(k, -k, R, 0); x.quadraticCurveTo(k, k, 0, R); x.quadraticCurveTo(-k, k, -R, 0); x.quadraticCurveTo(-k, -k, 0, -R);
  x.fillStyle = col; x.fill(); x.restore();
}
function logo(cx, cy, s, bookK = 1, starK = 1, rot = 0, fg = K, bg = O) {   // s = px por unidad
  if (bookK > 0) { x.save(); x.translate(cx, cy - s); x.scale(s * bookK, s * bookK); x.fillStyle = fg; x.fill(BOOK); x.restore(); }
  if (starK > 0) star(cx, cy - s + 9 * s * bookK, 18.7 * s * starK, bookK > 0 ? bg : fg, rot);
}

// ---------- piezas comunes ----------
let NOCAP = false;
function caption(txt, u, a, b, col = K) {
  if (NOCAP) return;
  const k = eo(seg(u, a, a + .5)) * (1 - seg(u, b - .4, b));
  if (k <= 0) return;
  x.globalAlpha = k; x.fillStyle = col; x.font = SG(500, 104); x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.fillText(txt, W / 2, 268 + (1 - k) * 30); x.globalAlpha = 1;
}
function tap(px, py, u, at) {
  const k = seg(u, at, at + .5); if (k <= 0 || k >= 1) return;
  x.globalAlpha = (1 - k) * .55; x.fillStyle = C; x.beginPath(); x.arc(px, py, 30 + 110 * eo(k), 0, 7); x.fill();
  x.globalAlpha = (1 - k) * .9; x.beginPath(); x.arc(px, py, 26, 0, 7); x.fill(); x.globalAlpha = 1;
}
function rr(px, py, w, h, r) { x.beginPath(); x.roundRect(px, py, w, h, r); }
function nav(active, bg = O, ink = K, k = 1) {
  if (k <= 0) return;
  const y0 = H - 190 * k; x.fillStyle = bg; x.fillRect(0, y0, W, 190);
  x.fillStyle = ink; x.globalAlpha = .25; x.fillRect(0, y0, W, 2); x.globalAlpha = 1;
  const xs = [150, 345, 540, 735, 930], cy = y0 + 92;
  xs.forEach((cx, i) => {
    const on = i === active, r = i === 2 ? 58 : 48;
    x.lineWidth = 3; x.strokeStyle = ink; x.beginPath(); x.arc(cx, cy, r, 0, 7);
    if (on) { x.fillStyle = ink; x.fill(); } else x.stroke();
    const c = on ? bg : ink; x.strokeStyle = c; x.fillStyle = c; x.lineWidth = 4; x.lineCap = 'round';
    if (i === 0) { [[-14, -16, 30], [-2, -22, 36], [10, -14, 28]].forEach(([dx, dy, h]) => { x.strokeRect(cx + dx - 4, cy + dy + 2, 8, h); }); x.beginPath(); x.moveTo(cx - 24, cy + 18); x.lineTo(cx + 24, cy + 18); x.stroke(); }
    if (i === 1) { x.beginPath(); x.arc(cx, cy, 20, 0, 7); x.stroke(); x.fillRect(cx - 2, cy - 4, 4, 14); x.fillRect(cx - 2, cy - 11, 4, 4); }
    if (i === 2) star(cx, cy, 24, c);
    if (i === 3) { x.beginPath(); [[-22, -10, -22, -22, -10, -22], [10, -22, 22, -22, 22, -10], [22, 10, 22, 22, 10, 22], [-10, 22, -22, 22, -22, 10]].forEach(p => { x.moveTo(cx + p[0], cy + p[1]); x.lineTo(cx + p[2], cy + p[3]); x.lineTo(cx + p[4], cy + p[5]); }); x.stroke(); [-10, -4, 2, 8].forEach(d => { x.fillRect(cx + d, cy - 10, 3, 20); }); }
    if (i === 4) { [[-16, -16], [4, -16], [-16, 4], [4, 4]].forEach(([dx, dy]) => { rr(cx + dx, cy + dy, 13, 13, 3); x.stroke(); }); }
  });
  return { xs, cy };
}
function entry(u, kPlus = 1, kLook = 1, squish = 1) {
  const cy1 = 900, cy2 = 1330;
  x.fillStyle = K;
  x.beginPath(); x.arc(540, cy1, 300 * squish * kPlus, 0, 7); x.fill();
  x.beginPath(); x.arc(540, cy2, 100 * kLook, 0, 7); x.fill();
  x.strokeStyle = O; x.lineCap = 'round';
  if (kPlus > .3) { x.lineWidth = 46 * kPlus; x.beginPath(); x.moveTo(540 - 105 * kPlus, cy1); x.lineTo(540 + 105 * kPlus, cy1); x.moveTo(540, cy1 - 105 * kPlus); x.lineTo(540, cy1 + 105 * kPlus); x.stroke(); }
  if (kLook > .3) { x.lineWidth = 15 * kLook; x.beginPath(); x.arc(530, cy2 - 10, 30 * kLook, 0, 7); x.moveTo(552, cy2 + 12); x.lineTo(572 * kLook + 540 * (1 - kLook), cy2 + 32 * kLook); x.stroke(); }
}
function bookCard(cx, cy, s, extra) {     // ficha de un libro (ejemplo inventado)
  x.save(); x.translate(cx, cy); x.scale(s, s);
  x.fillStyle = C; rr(-450, -200, 900, 400, 36); x.fill();
  x.fillStyle = K; rr(-410, -160, 210, 320, 14); x.fill();          // portada
  x.fillStyle = O; x.fillRect(-380, -120, 150, 10); x.fillRect(-380, -100, 100, 10);
  star(-305, 60, 34, O);
  x.fillStyle = K; x.textAlign = 'left'; x.font = SG(500, 62); x.fillText('Mares de tinta', -160, -86);
  x.font = MONO(500, 30); x.globalAlpha = .65; x.fillText('Ana Ríos · 2021', -160, -36); x.fillText('432 págs.', -160, 6); x.globalAlpha = 1;
  if (extra) extra();
  x.restore();
}

// ---------- datos de las escenas ----------
const SH = (() => {   // baldas: 3 baldas con lomos
  const r = mul(11), cols = [K, O, '#2a2a2a', C, '#c23a0b', K, C], out = [];
  [760, 1120, 1480].forEach((y, si) => { let xx = 110; const n = si === 1 ? 7 : 8; for (let i = 0; i < n; i++) { const w = 62 + r() * 40, h = 210 + r() * 120; out.push({ si, x: xx, w, h, y, c: cols[(i * 3 + si) % cols.length] }); xx += w + 10; } });
  return out;
})();
const MOVE = SH.findIndex(s => s.si === 0 && s.c === O);
const SUN = (() => {   // puntos del sol: 10 libros = pozos, páginas alrededor y arcos
  const r = mul(7), wells = Array.from({ length: 10 }, () => { const z = r() * 2 - 1, a = r() * 6.283, q = Math.sqrt(1 - z * z); return [q * Math.cos(a), q * Math.sin(a), z]; });
  const g = () => Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(6.283 * r());
  const pts = [];
  for (let i = 0; i < 2200; i++) {
    const w = wells[i % 10], arc = r() < .16, w2 = wells[(i + 3) % 10];
    let v = arc ? null : [w[0] + g() * .22, w[1] + g() * .22, w[2] + g() * .22];
    if (v) { const l = Math.hypot(...v); v = v.map(c => c / l); }
    const sp = SH[i % SH.length];
    pts.push({ v, arc, w, w2, t: r(), h: .05 + r() * .25, sx: sp.x + r() * sp.w, sy: sp.y - r() * sp.h, d: r() * .5, sz: 3 + r() * 3 });
  }
  return pts;
})();
const GAL = (() => {
  const r = mul(5), g = () => Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(6.283 * r()), out = [];
  for (let i = 0; i < 3400; i++) {
    const R = Math.min(480, -150 * Math.log(1 - r() * .985)) + 8, arm = r() < .5 ? 0 : Math.PI, sig = .22 + 2.6 * Math.exp(-R / 55);
    out.push({ R, th: arm + Math.log(1 + R / 40) * 2.3 + g() * sig, z: g() * 8, big: r() < .03, sz: 3 + r() * 2.6 });
  }
  return out;
})();
const BARS = (() => { const r = mul(3), b = []; let xx = 0; while (xx < 460) { const w = r() < .5 ? 6 : r() < .5 ? 12 : 18; if (r() < .6) b.push([xx, w]); xx += w + (r() < .5 ? 6 : 10); } return b; })();

// ---------- escenas (u = segundos desde el inicio de la escena) ----------
function sIntro(u) {
  x.fillStyle = O; x.fillRect(0, 0, W, H);
  const bk = back(seg(u, .2, 1.1)), sk = back(seg(u, .9, 1.6));
  logo(540, 880, 6.2, bk, sk, (1 - seg(u, .9, 1.6)) * 1.6);
  const tk = eo(seg(u, 1.7, 2.4));
  x.globalAlpha = tk; x.fillStyle = K; x.font = SG(500, 120); x.textAlign = 'center'; x.fillText('BiblioScan', 540, 1250 + (1 - tk) * 30); x.globalAlpha = 1;
}
function sScan(u) {
  x.fillStyle = O; x.fillRect(0, 0, W, H);
  const ex = eio(seg(u, 1.4, 2.0));                 // el «+» se abre en la cámara
  if (ex <= 0) { entry(u, 1, 1, 1 - .04 * Math.sin(Math.PI * seg(u, 1.0, 1.35))); tap(540, 900, u, 1.0); }
  else {
    entry(u, 0, 1 - ex);
    const w = lerp(600, 900, ex), h = lerp(600, 900, ex), cy = lerp(900, 820, ex);
    x.fillStyle = DK; rr(540 - w / 2, cy - h / 2, w, h, lerp(300, 30, ex)); x.fill();
    if (ex >= 1) {
      // cámara: etiqueta con código de barras, esquinas y láser
      const j = Math.sin(u * 2.3) * 6, ang = Math.sin(u * 1.7) * .03;
      x.save(); x.translate(540 + j, 800 + j * .5); x.rotate(ang);
      x.fillStyle = '#f4f2ec'; rr(-280, -170, 560, 340, 18); x.fill();
      x.fillStyle = K; BARS.forEach(([bx, bw]) => x.fillRect(-230 + bx, -120, bw, 200));
      x.font = MONO(500, 26); x.textAlign = 'center'; x.fillText('9 788412 345678', 0, 130);
      x.restore();
      x.strokeStyle = C; x.lineWidth = 8; x.lineCap = 'round'; const q = 380, L = 70;
      [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy]) => { x.beginPath(); x.moveTo(540 + sx * q, 820 + sy * (q - L)); x.lineTo(540 + sx * q, 820 + sy * q); x.lineTo(540 + sx * (q - L), 820 + sy * q); x.stroke(); });
      const lz = seg(u, 2.3, 4.3);
      if (lz > 0 && lz < 1) { const ly = 800 + Math.sin(lz * Math.PI * 3) * 150; x.fillStyle = O; x.globalAlpha = .9; x.fillRect(250, ly - 3, 580, 6); x.globalAlpha = .25; x.fillRect(250, ly - 18, 580, 36); x.globalAlpha = 1; }
      const fl = seg(u, 4.3, 4.7); if (fl > 0 && fl < 1) { x.globalAlpha = (1 - fl) * .5; x.fillStyle = C; rr(90, 370, 900, 900, 30); x.fill(); x.globalAlpha = 1; }
    }
    // ficha que sube, se guarda y vuela al catálogo
    const up = back(seg(u, 4.5, 5.3)), fly = eio(seg(u, 6.3, 7.1));
    if (up > 0 && fly < 1) {
      const cx = lerp(540, 930, fly), cy2 = lerp(lerp(2300, 1420, up), H - 98, fly), s = lerp(1, .08, fly);
      bookCard(cx, cy2, s, () => {
        const pr = 1 - .1 * Math.sin(Math.PI * seg(u, 5.8, 6.1));
        x.fillStyle = K; x.beginPath(); x.arc(360, 110, 62 * pr, 0, 7); x.fill();
        x.strokeStyle = O; x.lineWidth = 14; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); x.moveTo(332, 112); x.lineTo(354, 134); x.lineTo(392, 90); x.stroke();
      });
      tap(540 + 360, 1420 + 110, u, 5.8);
    }
  }
  const n = nav(3);
  const pop = seg(u, 7.0, 7.8); if (pop > 0 && pop < 1) { x.globalAlpha = 1 - pop; x.fillStyle = K; x.font = SG(500, 64); x.textAlign = 'center'; x.fillText('+1', n.xs[4], n.cy - 90 - pop * 60); x.globalAlpha = 1; }
  caption('Escanea', u, .2, 8);
}
function sLook(u) {
  x.fillStyle = O; x.fillRect(0, 0, W, H);
  const ex = eio(seg(u, .9, 1.5));
  entry(u, 1 - ex, 1, 1);
  tap(540, 1330, u, .6);
  if (ex > 0) {
    const s = lerp(.2, 1, back(seg(u, .9, 1.5))), cy = lerp(1330, 960, ex);
    x.globalAlpha = cl(ex * 2);
    bookCard(540, cy, s, () => {
      const pk = eo(seg(u, 1.6, 2.1));
      x.globalAlpha = pk; x.fillStyle = K; rr(-160, 70, 430, 74, 37); x.fill();
      x.fillStyle = C; x.font = MONO(600, 30); x.textAlign = 'left'; x.fillText('Balda 3', -116, 118);
      star(-130, 107, 16, O);
      x.globalAlpha = 1;
    });
    x.globalAlpha = 1;
  }
  nav(3);
  caption('Consulta', u, .2, 5);
}
function shelfPos(i, u) {
  const s = SH[i], mv = eio(seg(u, 2.0, 3.6));
  if (i === MOVE) {
    const tx = 110 + SH.filter(q => q.si === 1).slice(0, 3).reduce((a, q) => a + q.w + 10, 0);
    const lift = eo(seg(u, 1.6, 1.9)) * (1 - seg(u, 3.6, 3.9));
    return { x: lerp(s.x, tx, mv), y: lerp(s.y, 1120, mv) - lift * 40 - Math.sin(Math.PI * mv) * 140, sc: 1 + lift * .06 };
  }
  let dx = 0;
  const m = SH[MOVE];
  if (s.si === 0 && s.x > m.x) dx = -(m.w + 10) * mv;
  if (s.si === 1 && SH.filter(q => q.si === 1).indexOf(s) >= 3) dx = (m.w + 10) * mv;
  return { x: s.x + dx, y: s.y, sc: 1 };
}
function sShelf(u, dotsOut = 0) {
  x.fillStyle = P; x.fillRect(0, 0, W, H);
  x.fillStyle = K; [760, 1120, 1480].forEach(y => x.fillRect(80, y, 920, 10));
  SH.forEach((s, i) => {
    if (i === MOVE) return;
    const p = shelfPos(i, u); x.globalAlpha = 1 - dotsOut;
    x.fillStyle = s.c; x.fillRect(p.x, p.y - s.h, s.w, s.h);
    if (s.c === C) { x.strokeStyle = K; x.lineWidth = 3; x.strokeRect(p.x + 1.5, p.y - s.h + 1.5, s.w - 3, s.h - 3); }
  });
  const m = SH[MOVE], p = shelfPos(MOVE, u);
  x.save(); x.translate(p.x + m.w / 2, p.y); x.scale(p.sc, p.sc); x.globalAlpha = 1 - dotsOut;
  x.fillStyle = m.c; x.fillRect(-m.w / 2, -m.h, m.w, m.h); x.restore(); x.globalAlpha = 1;
  const ring = seg(u, 1.0, 1.6);
  if (ring > 0 && ring < 1) { x.strokeStyle = K; x.lineWidth = 8; x.beginPath(); x.arc(m.x + m.w / 2, m.y - m.h / 2, 120, -Math.PI / 2, -Math.PI / 2 + ring * 6.283); x.stroke(); }
  tap(m.x + m.w / 2, m.y - m.h / 2, u, .9);
}
function sunPal(u) {      // Sol → Noche → Papel → Sol
  const T = [[O, C], ['#121212', '#ffb08a'], [P, K], [O, C]], cuts = [2.6, 4.2, 5.6];
  let i = 0; while (i < 3 && u > cuts[i] + .4) i++;
  const k = i < 3 ? seg(u, cuts[i], cuts[i] + .4) : 0, a = T[i], b = T[Math.min(3, i + 1)];
  return { bg: mixHex(a[0], b[0], k), pt: mixHex(a[1], b[1], k), raw: k < .5 ? a : b, idx: k < .5 ? i : i + 1 };
}
function sunDots(u, R, cx, cy, col, form) {
  const ry = u * .55, rx = .35, cr = Math.cos(ry), sr = Math.sin(ry), cx_ = Math.cos(rx), sx_ = Math.sin(rx);
  x.fillStyle = col;
  for (const d of SUN) {
    let v;
    if (d.arc) { const t = (d.t + u * .25) % 1, a = d.w, b = d.w2, om = Math.acos(cl(a[0] * b[0] + a[1] * b[1] + a[2] * b[2], -1, 1)) || 1e-3, s = Math.sin(om), k1 = Math.sin((1 - t) * om) / s, k2 = Math.sin(t * om) / s, hh = 1 + d.h * Math.sin(Math.PI * t);
      v = [(a[0] * k1 + b[0] * k2) * hh, (a[1] * k1 + b[1] * k2) * hh, (a[2] * k1 + b[2] * k2) * hh]; }
    else v = d.v;
    const X = v[0] * cr + v[2] * sr, Z0 = -v[0] * sr + v[2] * cr, Y = v[1] * cx_ - Z0 * sx_, Z = v[1] * sx_ + Z0 * cx_;
    const f = eio(cl((form - d.d) / (1 - d.d * .9)));
    const px = lerp(d.sx, cx + X * R, f), py = lerp(d.sy, cy + Y * R, f), al = lerp(1, Z > 0 ? .95 : .28, f);
    x.globalAlpha = al; x.fillRect(px, py, d.sz, d.sz);
  }
  x.globalAlpha = 1;
}
function sSun(u) {
  const pal = sunPal(u);
  const form = seg(u, .2, 1.8);
  if (form < 1) { sShelf(6, 1); x.globalAlpha = form; x.fillStyle = pal.bg; x.fillRect(0, 0, W, H); x.globalAlpha = 1; }
  else { x.fillStyle = pal.bg; x.fillRect(0, 0, W, H); }
  sunDots(u, 340, 540, 960, form < 1 ? mixHex(K, C, form) : pal.pt, form);
  // selector de tema (sin texto)
  const tk = eo(seg(u, 2.0, 2.5)) * (1 - seg(u, 6.4, 6.9));
  if (tk > 0) {
    const TH = [[O, C], ['#121212', '#ffb08a'], [P, K]], act = [0, 1, 2, 0][pal.idx];
    TH.forEach(([a, b], i) => { const cx = 420 + i * 120, cy = 1500; x.globalAlpha = tk;
      x.save(); x.beginPath(); x.arc(cx, cy, 40, 0, 7); x.clip(); x.fillStyle = a; x.fillRect(cx - 40, cy - 40, 80, 80); x.fillStyle = b; x.beginPath(); x.moveTo(cx + 40, cy - 40); x.lineTo(cx + 40, cy + 40); x.lineTo(cx - 40, cy + 40); x.fill(); x.restore();
      x.strokeStyle = pal.raw[1]; x.lineWidth = 3; x.beginPath(); x.arc(cx, cy, 40, 0, 7); x.stroke();
      if (i === act) { x.lineWidth = 5; x.beginPath(); x.arc(cx, cy, 54, 0, 7); x.stroke(); } });
    x.globalAlpha = 1;
  }
  [2.4, 4.0, 5.4].forEach((at, i) => tap(420 + [1, 2, 0][i] * 120, 1500, u, at));
  const ink = lum(pal.raw[0]) < .35 ? pal.raw[1] : K;
  nav(2, pal.bg, ink);
  caption('Tu sol', u, .3, 7, ink);
}
const lum = h => { const p = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255); return .2126 * p[0] + .7152 * p[1] + .0722 * p[2]; };
function galaxy(u, cx, cy, grow, col, collapse = 0) {
  const rot = u * .22, tilt = .5;
  x.fillStyle = col;
  for (const g of GAL) {
    const vis = cl((grow * 540 - g.R) / 60); if (vis <= 0) continue;
    const th = g.th + rot * (1 + .7 * Math.exp(-g.R / 120));
    let px = Math.cos(th) * g.R, py = Math.sin(th) * g.R * tilt + g.z;
    const k = eio(collapse); px *= 1 - k; py *= 1 - k;
    const s = (g.big ? 7 : g.sz) * (1 - k * .6);
    x.globalAlpha = vis * (g.big ? 1 : .8); x.fillRect(cx + px - s / 2, cy + py - s / 2, s, s);
  }
  x.globalAlpha = 1;
}
function sGal(u) {
  x.fillStyle = O; x.fillRect(0, 0, W, H);
  const sh = eio(seg(u, 0, 1.0));
  if (sh < 1) sunDots(u + 7, lerp(340, 30, sh), 540, lerp(960, 930, sh), C, 1);
  galaxy(u, 540, 930, eo(seg(u, .8, 3.6)), C);
  // tu sol dentro de la galaxia
  const me = eo(seg(u, 3.4, 3.9)), th = 1.1 + u * .22 * 1.15, mx = 540 + Math.cos(th) * 300, my = 930 + Math.sin(th) * 300 * .5;
  if (me > 0) { x.strokeStyle = K; x.lineWidth = 5; x.globalAlpha = me; x.setLineDash([10, 10]); x.beginPath(); x.arc(mx, my, 34 + (1 - me) * 40, 0, 7); x.stroke(); x.setLineDash([]); star(mx, my, 14, K); x.globalAlpha = 1; }
  nav(2);
  caption('Únete a la galaxia', u, .4, 6);
}
function sOutro(u) {
  x.fillStyle = O; x.fillRect(0, 0, W, H);
  const col = seg(u, 0, .9);
  if (col < 1) galaxy(u + 6, 540, 930, 1, C, col);
  const bk = back(seg(u, .7, 1.5)), sk = eo(seg(u, .5, 1.1));
  logo(540, 880, 6.2, bk, sk, 0);
  const tk = eo(seg(u, 1.4, 2.1));
  x.globalAlpha = tk; x.fillStyle = K; x.font = SG(500, 120); x.textAlign = 'center'; x.fillText('BiblioScan', 540, 1250 + (1 - tk) * 30);
  x.font = MONO(500, 34); x.globalAlpha = tk * .7; x.fillText('Android · gratis', 540, 1330); x.globalAlpha = 1;
  const end = seg(u, 3.6, 4); if (end > 0) { x.globalAlpha = end; x.fillStyle = O; x.fillRect(0, 0, W, H); x.globalAlpha = 1; }
}
const SCENES = [[0, 4, sIntro], [4, 12, sScan], [12, 17, sLook], [17, 23, u => { sShelf(u); nav(0, P, K); caption('Ordena', u, .2, 6); }], [23, 30, sSun], [30, 36, sGal], [36, 40, sOutro]];
const WIPE = [null, [540, 900], [540, 1330], [540, 960], null, null, null];   // las que entran con un círculo que se abre
function frame(t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1;
  const i = SCENES.findIndex(([a, b]) => t >= a && t < b), [a, , fn] = SCENES[i < 0 ? SCENES.length - 1 : i], u = t - a;
  const wk = seg(u, 0, .5);
  if (i > 0 && WIPE[i] && wk < 1) {
    const [pa, pb, pf] = SCENES[i - 1]; pf(pb - pa - .001);
    x.save(); x.beginPath(); x.arc(WIPE[i][0], WIPE[i][1], eio(wk) * 2300, 0, 7); x.clip(); fn(u); x.restore();
  } else fn(u);
}

// ---------- capturas fijas para el tutorial de la app ----------
function ibtn(cx, cy, r, glyph, fill, ink = K, bg = O) {
  x.lineWidth = 3; x.strokeStyle = ink; x.beginPath(); x.arc(cx, cy, r, 0, 7);
  if (fill) { x.fillStyle = ink; x.fill(); } else x.stroke();
  const c = fill ? bg : ink; x.strokeStyle = c; x.fillStyle = c; x.lineWidth = 4; x.lineCap = 'round'; x.lineJoin = 'round'; glyph(c);
}
const G = {
  spiral: (cx, cy) => () => { x.beginPath(); for (let a = 0; a < 7; a += .1) { const r = 2 + a * 3; x.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r * .8); } x.stroke(); x.beginPath(); for (let a = 0; a < 7; a += .1) { const r = 2 + a * 3; x.lineTo(cx - Math.cos(a) * r, cy - Math.sin(a) * r * .8); } x.stroke(); },
  sliders: (cx, cy) => () => { x.beginPath(); x.moveTo(cx - 18, cy - 8); x.lineTo(cx + 18, cy - 8); x.moveTo(cx - 18, cy + 8); x.lineTo(cx + 18, cy + 8); x.stroke(); x.beginPath(); x.arc(cx + 8, cy - 8, 5, 0, 7); x.fill(); x.beginPath(); x.arc(cx - 8, cy + 8, 5, 0, 7); x.fill(); },
  info: (cx, cy) => () => { x.fillRect(cx - 2.5, cy - 4, 5, 18); x.fillRect(cx - 2.5, cy - 13, 5, 5); },
  star: (cx, cy) => c => star(cx, cy, 18, c),
  eye: (cx, cy) => () => { x.beginPath(); x.ellipse(cx, cy, 20, 11, 0, 0, 7); x.stroke(); x.beginPath(); x.arc(cx, cy, 5, 0, 7); x.fill(); },
  trash: (cx, cy) => () => { x.beginPath(); x.moveTo(cx - 16, cy - 10); x.lineTo(cx + 16, cy - 10); x.moveTo(cx - 11, cy - 10); x.lineTo(cx - 8, cy + 16); x.lineTo(cx + 8, cy + 16); x.lineTo(cx + 11, cy - 10); x.stroke(); },
  qr: (cx, cy) => () => { [[-14, -14], [4, -14], [-14, 4]].forEach(([dx, dy]) => x.strokeRect(cx + dx, cy + dy, 10, 10)); x.fillRect(cx + 6, cy + 6, 6, 6); },
  share: (cx, cy) => () => { [[10, -12], [-10, 0], [10, 12]].forEach(([dx, dy]) => { x.beginPath(); x.arc(cx + dx, cy + dy, 5, 0, 7); x.fill(); }); x.beginPath(); x.moveTo(cx - 10, cy); x.lineTo(cx + 10, cy - 12); x.moveTo(cx - 10, cy); x.lineTo(cx + 10, cy + 12); x.stroke(); },
  db: (cx, cy) => () => { x.beginPath(); x.ellipse(cx, cy - 12, 14, 5, 0, 0, 7); x.stroke(); x.beginPath(); x.moveTo(cx - 14, cy - 12); x.lineTo(cx - 14, cy + 12); x.ellipse(cx, cy + 12, 14, 5, 0, Math.PI, 0, true); x.lineTo(cx + 14, cy - 12); x.stroke(); },
  upd: (cx, cy) => () => { x.beginPath(); x.arc(cx, cy, 15, -.3, 4.6); x.stroke(); x.beginPath(); x.moveTo(cx + 15, cy - 14); x.lineTo(cx + 15, cy - 3); x.lineTo(cx + 4, cy - 3); x.stroke(); },
};
function stillCat() {
  const gr = x.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#f6dccb'); gr.addColorStop(1, P); x.fillStyle = gr; x.fillRect(0, 0, W, H);
  x.fillStyle = K; x.font = SG(500, 168); x.textAlign = 'left'; x.fillText('Mares', 70, 900); x.fillText('de tinta', 70, 1060);
  x.font = MONO(500, 34); x.globalAlpha = .7; x.fillText('Ana Ríos · 2021 · Faro', 74, 1150); x.globalAlpha = 1;
  [[70, 150], [180, 150]].forEach(([cx]) => {});
  ibtn(110, 210, 44, () => { x.beginPath(); x.moveTo(92, 196); x.lineTo(128, 196); x.lineTo(114, 214); x.lineTo(114, 228); x.lineTo(106, 224); x.lineTo(106, 214); x.closePath(); x.stroke(); });
  ibtn(220, 210, 44, () => { [[-14, 8], [-2, -4], [10, -14]].forEach(([dx, h]) => x.fillRect(220 + dx - 4, 226 + Math.min(0, h) - 14, 8, 14 - Math.min(0, h))); });
  ibtn(970, 210, 44, () => { [-10, 0, 10].forEach(d => { x.beginPath(); x.moveTo(952, 210 + d); x.lineTo(988, 210 + d); x.stroke(); }); });
  ibtn(960, 1100, 46, () => { x.strokeRect(942, 1084, 36, 32); x.beginPath(); x.moveTo(946, 1112); x.lineTo(958, 1098); x.lineTo(966, 1106); x.lineTo(974, 1096); x.stroke(); });
  [0, 1, 2, 3, 4].forEach(i => { x.fillStyle = K; x.globalAlpha = i === 1 ? 1 : .25; x.beginPath(); x.arc(1030, 760 + i * 36, i === 1 ? 9 : 6, 0, 7); x.fill(); }); x.globalAlpha = 1;
  nav(4);
}
function stillHome() {
  x.fillStyle = O; x.fillRect(0, 0, W, H);
  sunDots(3, 340, 540, 880, C, 1);
  [[1450, 'spiral'], [1560, 'sliders'], [1670, 'info']].forEach(([cy, g]) => ibtn(970, cy - 30, 46, G[g](970, cy - 30), false));
  nav(2);
}
function stillInfo() {
  x.fillStyle = P; x.fillRect(0, 0, W, H);
  x.fillStyle = O; rr(70, 120, 130, 130, 26); x.fill(); logo(135, 190, 1.05, 1, 1, 0, K, O);
  x.fillStyle = K; x.textAlign = 'left'; x.font = SG(500, 70); x.fillText('BiblioScan', 230, 185); x.font = MONO(500, 30); x.globalAlpha = .6; x.fillText('VERSIÓN 1.9', 232, 232); x.globalAlpha = 1;
  const sec = (y, label, btns) => { x.fillStyle = K; x.globalAlpha = .25; x.fillRect(70, y - 70, 940, 2); x.globalAlpha = .6; x.font = MONO(600, 30); x.fillText(label, 70, y - 20); x.globalAlpha = 1;
    btns.forEach(([g, fill], i) => ibtn(130 + i * 130, y + 70, 50, G[g](130 + i * 130, y + 70), fill)); };
  sec(420, 'ACTUALIZAR', [['upd', false]]);

  sec(980, 'COMPARTIR BIBLIOSCAN', [['qr', true], ['share', false]]);
  sec(1260, 'COPIA DE SEGURIDAD', [['db', true]]);

window.renderStill = name => { NOCAP = true; x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1;
  ({ intro: () => frame(3.2), scan: () => frame(9.6), look: () => frame(15.5), cat: stillCat, shelf: () => frame(20.6), home: stillHome, galaxy: () => frame(35.2), info: stillInfo })[name]();
  NOCAP = false; };

// ---------- vista previa y exportación ----------
let t = 0, playing = false, last = 0;
const sc = document.getElementById('sc'), tt = document.getElementById('tt'), pp = document.getElementById('pp');
const show = () => { frame(t); sc.value = t; tt.textContent = t.toFixed(1) + ' s'; };
sc.oninput = () => { t = +sc.value; playing = false; pp.textContent = '▶'; show(); };
pp.onclick = () => { playing = !playing; pp.textContent = playing ? '❚❚' : '▶'; last = performance.now(); if (t >= DUR - .05) t = 0; };
const loop = now => { if (playing) { t += (now - last) / 1000; if (t >= DUR) { t = DUR - .001; playing = false; pp.textContent = '▶'; } show(); } last = now; requestAnimationFrame(loop); };
requestAnimationFrame(loop);
const q = new URLSearchParams(location.search); if (q.has('t')) t = +q.get('t'); show();
window.renderAt = s => { t = s; show(); };
document.getElementById('ex').onclick = async () => {
  const N = DUR * FPS;
  for (let f = 0; f < N; f++) {
    frame(f / FPS);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .94));
    await fetch('http://localhost:8830/f/' + String(f).padStart(4, '0'), { method: 'POST', body: blob });
    if (f % 15 === 0) tt.textContent = `exportando ${f}/${N}`;
  }
  tt.textContent = 'exportación lista'; window.exportDone = true;
};
})();
